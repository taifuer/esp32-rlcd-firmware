<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title description">
  <title id="title">ESP32 RLCD Firmware v0.26.0 Beta settings page</title>
  <desc id="description">Settings summary with power saving, time zone, preferred daily display, playback volume, alarm and the quick settings entry.</desc>
  <rect width="400" height="300" rx="3" fill="#090b0a"/>
  <g fill="#eef3e8" stroke="#eef3e8">
    <text x="200" y="32" stroke="none" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">SETTINGS</text>
    <text x="388" y="32" stroke="none" text-anchor="end" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">3/4</text>
    <path d="M12 44H388M12 250H388" fill="none" stroke-width="1" shape-rendering="crispEdges"/>
    <g stroke="none" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">
      <text x="18" y="72">POWER</text>
      <text x="18" y="108">TIME ZONE</text>
      <text x="18" y="144">DISPLAY</text>
      <text x="18" y="180">VOLUME</text>
      <text x="18" y="216">ALARM</text>
    </g>
    <g stroke="none" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">
      <text x="116" y="72">SAVING | LOW BAT</text>
      <text x="116" y="108">UTC+08:00</text>
      <text x="116" y="144">WEATHER</text>
      <text x="116" y="180">68 %</text>
      <text x="116" y="216">07:30 MON-FRI</text>
    </g>
    <g stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">
      <text x="200" y="270">BOOT: HOME | KEY: ONLINE UPDATE</text>
      <text x="200" y="294" font-size="10">HOLD BOOT 2s: MANUAL SAVING ON | HOLD KEY 3s: QUICK SETTINGS</text>
    </g>
  </g>
</svg>
