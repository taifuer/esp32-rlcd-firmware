name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Repository and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check repository
        run: ./scripts/check-repository.sh

      - name: Prepare pinned cJSON test dependency
        shell: bash
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: |
          source ./tool-versions.env
          cjson_archive="${RLCD_DEPS_DIR}/downloads/espressif__cjson-v${CJSON_VERSION}.zip"
          cjson_root="${RLCD_DEPS_DIR}/sources/espressif/espressif__cjson"
          mkdir -p "$(dirname -- "${cjson_archive}")" \
            "$(dirname -- "${cjson_root}")"
          curl --fail --location --retry 3 \
            --output "${cjson_archive}" "${CJSON_ARCHIVE_URL}"
          echo "${CJSON_ARCHIVE_SHA256}  ${cjson_archive}" | \
            sha256sum --check --strict
          unzip -q "${cjson_archive}" -d "${cjson_root}"
          test -f "${cjson_root}/cJSON/cJSON.c"
          test -f "${cjson_root}/cJSON/cJSON.h"

      - name: Prepare pinned QR test dependency
        shell: bash
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: |
          source ./tool-versions.env
          component_root="${RLCD_DEPS_DIR}/sources/espressif/idf-extra-components"
          mkdir -p "$(dirname -- "${component_root}")"
          git clone --filter=blob:none --no-checkout \
            "${IDF_EXTRA_COMPONENTS_REPOSITORY_URL}" "${component_root}"
          git -C "${component_root}" sparse-checkout init --cone
          git -C "${component_root}" sparse-checkout set \
            "${QRCODE_COMPONENT_RELATIVE_PATH}"
          git -C "${component_root}" checkout --detach \
            "${IDF_EXTRA_COMPONENTS_COMMIT}"
          test "$(git -C "${component_root}" rev-parse HEAD)" = \
            "${IDF_EXTRA_COMPONENTS_COMMIT}"

      - name: Prepare pinned display font test dependency
        shell: bash
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: |
          source ./tool-versions.env
          display_root="${RLCD_DEPS_DIR}/sources/waveshareteam/ESP32-S3-RLCD-4.2"
          mkdir -p "$(dirname -- "${display_root}")"
          git clone --filter=blob:none --no-checkout \
            "${WAVESHARE_REPOSITORY_URL}" "${display_root}"
          git -C "${display_root}" sparse-checkout init --no-cone
          git -C "${display_root}" sparse-checkout set \
            "/${WAVESHARE_COMPONENTS_RELATIVE_PATH}/u8g2/csrc/"
          git -C "${display_root}" checkout --detach "${WAVESHARE_COMMIT}"
          test "$(git -C "${display_root}" rev-parse HEAD)" = "${WAVESHARE_COMMIT}"
          test -f "${display_root}/${WAVESHARE_COMPONENTS_RELATIVE_PATH}/u8g2/csrc/u8g2_fonts.c"

      - name: Run host tests
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: ./scripts/test.sh
