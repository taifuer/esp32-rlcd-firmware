name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Repository and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check repository
        run: ./scripts/check-repository.sh

      - name: Prepare pinned cJSON test dependency
        shell: bash
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: |
          source ./tool-versions.env
          idf_root="${RLCD_DEPS_DIR}/toolchains/esp-idf-v${ESP_IDF_VERSION}"
          mkdir -p "$(dirname -- "${idf_root}")"
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "v${ESP_IDF_VERSION}" \
            "${ESP_IDF_REPOSITORY_URL}" "${idf_root}"
          git -C "${idf_root}" sparse-checkout init --cone
          git -C "${idf_root}" sparse-checkout set components/json
          git -C "${idf_root}" checkout --detach "${ESP_IDF_COMMIT}"
          test "$(git -C "${idf_root}" rev-parse HEAD)" = \
            "${ESP_IDF_COMMIT}"

          cjson_path="components/json/cJSON"
          cjson_expected_commit="$(
            git -C "${idf_root}" rev-parse "HEAD:${cjson_path}"
          )"
          git -C "${idf_root}" submodule update --init --depth 1 \
            --filter=blob:none -- "${cjson_path}"
          cjson_actual_commit="$(
            git -C "${idf_root}/${cjson_path}" rev-parse HEAD
          )"
          test "${cjson_actual_commit}" = "${cjson_expected_commit}"

      - name: Prepare pinned QR test dependency
        shell: bash
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: |
          source ./tool-versions.env
          component_root="${RLCD_DEPS_DIR}/sources/espressif/idf-extra-components"
          mkdir -p "$(dirname -- "${component_root}")"
          git clone --filter=blob:none --no-checkout \
            "${IDF_EXTRA_COMPONENTS_REPOSITORY_URL}" "${component_root}"
          git -C "${component_root}" sparse-checkout init --cone
          git -C "${component_root}" sparse-checkout set \
            "${QRCODE_COMPONENT_RELATIVE_PATH}"
          git -C "${component_root}" checkout --detach \
            "${IDF_EXTRA_COMPONENTS_COMMIT}"
          test "$(git -C "${component_root}" rev-parse HEAD)" = \
            "${IDF_EXTRA_COMPONENTS_COMMIT}"

      - name: Run host tests
        env:
          RLCD_DEPS_DIR: ${{ runner.temp }}/esp32-rlcd-firmware-deps
        run: ./scripts/test.sh
