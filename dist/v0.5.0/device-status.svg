<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title description">
  <title id="title">ESP32 RLCD Firmware device status</title>
  <desc id="description">A white-on-black monochrome device status page showing firmware, RTC, sensor, battery, network and last synchronization.</desc>
  <rect width="400" height="300" rx="3" fill="#090b0a"/>
  <g fill="#eef3e8" stroke="#eef3e8">
    <text x="200" y="32" stroke="none" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">DEVICE STATUS</text>
    <path d="M12 44H388M12 244H388" fill="none" stroke-width="1" shape-rendering="crispEdges"/>

    <g stroke="none" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12" font-weight="500">
      <text x="18" y="75">FIRMWARE</text>
      <text x="18" y="105">RTC</text>
      <text x="18" y="135">SENSOR</text>
      <text x="18" y="165">BATTERY</text>
      <text x="18" y="195">NETWORK</text>
      <text x="18" y="225">LAST SYNC</text>
    </g>

    <g stroke="none" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">
      <text x="116" y="75">v0.5.0</text>
      <text x="116" y="105">OK | 2026-08-20 21:31</text>
      <text x="116" y="135">31.3 C | 73 %</text>
      <text x="116" y="165">93 % | 4125 mV</text>
      <text x="116" y="195">SYNCHRONIZED</text>
      <text x="116" y="225">2026-08-20 21:30</text>
    </g>

    <text x="200" y="274" stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11">BOOT: NEXT | KEY: BACK | HOLD KEY 5s: RESET WI-FI</text>
  </g>
</svg>
