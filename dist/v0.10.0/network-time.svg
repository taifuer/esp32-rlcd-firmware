<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title description">
  <title id="title">ESP32 RLCD Firmware network and time page</title>
  <desc id="description">A clean white-on-black system page showing network status, RTC, last synchronization and automatic synchronization interval.</desc>
  <rect width="400" height="300" rx="3" fill="#090b0a"/>
  <g fill="#eef3e8" stroke="#eef3e8">
    <text x="200" y="32" stroke="none" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">NETWORK &amp; TIME</text>
    <text x="388" y="32" stroke="none" text-anchor="end" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">2/6</text>
    <path d="M12 44H388M12 250H388" fill="none" stroke-width="1" shape-rendering="crispEdges"/>
    <g stroke="none" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">
      <text x="18" y="82">NETWORK</text>
      <text x="18" y="126">RTC</text>
      <text x="18" y="170">LAST SYNC</text>
      <text x="18" y="214">AUTO SYNC</text>
    </g>
    <g stroke="none" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">
      <text x="116" y="82">SYNCHRONIZED</text>
      <text x="116" y="126">2026-08-20 21:31</text>
      <text x="116" y="170">2026-08-20 21:30</text>
      <text x="116" y="214">EVERY 24 HOURS</text>
    </g>
    <text x="200" y="280" stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">BOOT: HOME | KEY: NEXT | HOLD KEY 2s: SYNC</text>
  </g>
</svg>
