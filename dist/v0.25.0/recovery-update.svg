<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title description">
  <title id="title">启动恢复：在线更新</title>
  <desc id="description">恢复模式的在线更新页，显示当前版本、最近异常复位与上次启动阶段，以及更新操作。</desc>
  <rect width="400" height="300" rx="3" fill="#090b0a"/>
  <g fill="#eef3e8" stroke="#eef3e8">
    <text x="200" y="32" stroke="none" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">ONLINE UPDATE</text>
    <path d="M12 44H388M12 250H388" fill="none" stroke-width="1" shape-rendering="crispEdges"/>
    <g stroke="none" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">
      <text x="18" y="72">CURRENT</text>
      <text x="18" y="108">LATEST</text>
      <text x="18" y="144">LAST RESET</text>
      <text x="18" y="180">FAILED AT</text>
      <text x="18" y="216">STATUS</text>
    </g>
    <g stroke="none" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">
      <text x="116" y="72">v0.25.0</text>
      <text x="116" y="108">--</text>
      <text x="116" y="144">PANIC x3</text>
      <text x="116" y="180">SERVICES</text>
      <text x="116" y="216">NOT CHECKED</text>
    </g>
    <text x="200" y="280" stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">KEY: SETTINGS | HOLD KEY 2s: CHECK UPDATE</text>
  </g>
</svg>
