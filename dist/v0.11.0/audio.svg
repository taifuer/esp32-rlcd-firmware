<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title description">
  <title id="title">ESP32 RLCD Firmware audio diagnostics page</title>
  <desc id="description">A clean white-on-black audio page showing a played test tone, two microphone levels, volatile voice loopback and the diagnostic result.</desc>
  <rect width="400" height="300" rx="3" fill="#090b0a"/>
  <g fill="#eef3e8" stroke="#eef3e8">
    <text x="200" y="32" stroke="none" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">AUDIO</text>
    <text x="388" y="32" stroke="none" text-anchor="end" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">2/4</text>
    <path d="M12 44H388M12 250H388" fill="none" stroke-width="1" shape-rendering="crispEdges"/>
    <g stroke="none" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">
      <text x="18" y="72">SPEAKER</text>
      <text x="18" y="108">MIC 1</text>
      <text x="18" y="144">MIC 2</text>
      <text x="18" y="180">LOOPBACK</text>
      <text x="18" y="216">RESULT</text>
    </g>
    <g stroke="none" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">
      <text x="116" y="72">TONE PLAYED</text>
      <text x="116" y="108">37 %</text>
      <text x="116" y="144">34 %</text>
      <text x="116" y="180">VOICE PLAYED | MIC 1</text>
      <text x="116" y="216">INPUT DETECTED</text>
    </g>
    <text x="200" y="280" stroke="none" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="12">BOOT: HOME | KEY: NEXT | HOLD KEY 2s: TEST</text>
  </g>
</svg>
